# DO NOT EDIT: This file should only be modified in the `go-public-library-template` repo.

name: Run code validation checks

on:
  merge_group:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Run code validation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Build
        run: go build ./...

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum ||
            (echo '::error file=go.mod,title=Untidy go.mod::Run "go mod tidy"' && exit 1)

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error title=Unformatted Go files::Run \"gofmt -s -w .\" on: ${unformatted//$'\n'/ }"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
